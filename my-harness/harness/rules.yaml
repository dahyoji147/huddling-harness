# 규칙 SSOT. 에이전트 프롬프트와 판정 스크립트는 이 파일만 읽는다.
# 이 파일을 바꾸면 harness/tests 를 다시 돌린다.
version: 1
# judge.mjs 와 lib/*.mjs 의 해시. `node harness/pin.mjs` 로만 갱신한다. 불일치하면 종료 코드 3.
judge_sha256: "ffb3db00d753a50a6874fe89a0ab9bde7775f48a279bf1134af1912d6d39e3e3"

failure_limit: 3

g1:
  min_points: 5

g2:
  # 화면 설계 섹션의 본문(공백 제외 글자 수) 최소 길이. 제목만 있는 빈 설계를 막는다.
  min_section_chars: 200

g5:
  # 완성 화면이 비어 있지 않도록: 프레임 아래 노드와 텍스트 노드의 최소 개수
  min_nodes: 15
  min_text_nodes: 5
  # 클립된 프레임 안에서 자식이 밖으로 나가 잘려 보이면 위반이다. 의도한 가로 스크롤 줄은 이 접두사로 이름을 지으면 예외다.
  clip_exempt_prefix: ["가로스크롤"]

g3:
  keyscreens_min: 2
  keyscreens_max: 3

frame:
  width: 390
  height: 844

design:
  radius_allowed: [0, 16, 24, 9999]
  # 30% 스퀴클 아이콘 등 이름이 이 접두사로 시작하면 반경 검사를 건너뛴다
  radius_exempt_prefix: ["app-icon"]
  # 세그먼트 컨트롤의 활성 칸만 그림자를 허용한다
  shadow_exempt_prefix: ["segmented-control-active"]
  shadows_max: 0
  # 허용 글꼴. Noto Sans KR 은 Figma 연결에서 Pretendard 를 쓸 수 없는 동안의 임시 허용이다.
  # (design.md 대체 글꼴 목록에 있는 글꼴) 완성 뒤 Figma 앱에서 Pretendard 로 일괄 교체하고 이 줄에서 뺀다.
  font_families: ["Pretendard", "Noto Sans KR"]
  accent_hex: "#0066ff"
  accent_max_per_screen: 2

star_a:
  email_regex: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
  # 국내 번호(010-1234-5678, 010.1234.5678)와 국제 표기(+82 10-1234-5678)를 잡는다. 앞뒤가 숫자면 긴 숫자의 일부로 보고 제외한다.
  phone_regex: "(?<!\\d)(?:\\+82[ -]?|0)\\d{1,2}[-. ]?\\d{3,4}[-. ]?\\d{4}(?!\\d)"
  # 고객사명 등 금지어. 처음엔 비워 두고 쓰면서 추가한다.
  forbidden_words: []

star_b:
  # 공개 범위 필드 노드 이름: 공개범위/기본=<값>
  field_name_prefix: "공개범위/기본="
  required_default: "비공개"
  # 이 정규식에 맞는 텍스트("공개 범위", "공개범위", "공개 설정")가 있는 화면에는 위 이름의 필드가 있어야 한다
  trigger_regex: "공개\\s*(?:범위|설정)"

# 이 정규식에 맞는 문장은 부정문("~하지 않는다", "넣지 말아 주세요")으로 보고 금지어 검사에서 제외한다.
negation_regex: "(않|말아|금지|수 없|없이|아니)"

scope:
  # MVP 범위 밖 항목(story-service.md 기준 결정). 이 단어가 화면 텍스트에 나오면 위반이다.
  out_of_scope_words: ["구매", "결제", "정산", "허들링 픽", "판매 중", "피드백"]

# docs/design.md 의 Do's and Don'ts 중 스크립트로 세는 규칙
guide:
  canvas_hex: "#ffffff"
  # 팔레트(ink, ink-soft, canvas, canvas-soft, field, hairline, text-muted, text-faint, accent). 이 밖의 색은 위반이다.
  palette: ["#141414", "#262626", "#ffffff", "#f3f3f3", "#f0f0f0", "#e0e0e0", "#707070", "#adadad", "#0066ff"]
  # 노드 이름이 이 정규식에 맞으면 pill(반경 9999)이어야 한다 (버튼, 칩, 토글, 배지)
  # 이름이 이것으로 시작하는 요소만 본다 ("칩 줄" 같은 칩을 담은 컨테이너는 제외)
  pill_name_regex: "^(chip|button|icon-button|step-indicator|file-attach-row|visibility-row|단계 표시|공개범위/)"
  # 이 이름의 노드에는 강조색(파랑) 채움을 쓰지 않는다 (CTA 는 항상 잉크)
  cta_name_regex: "button|버튼"
  # 입력 필드는 쉴 때 테두리가 없다
  input_name_regex: "text-input|입력"
  # 34 는 iOS 홈 인디케이터 여백(설계 문서가 정한 값)
  spacing_allowed: [0, 4, 8, 12, 16, 24, 32, 34, 48, 64]
  font_sizes: [32, 28, 24, 20, 18, 17, 15, 13, 12]
  # 행간 비율(행간 px / 글자 크기). 제목급(heading_min_size 이상)은 1.3~1.35, 나머지는 1.4~1.5
  line_height_min: 1.3
  line_height_max: 1.5
  heading_line_height_max: 1.35
  heading_min_size: 18
